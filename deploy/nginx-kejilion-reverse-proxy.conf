# =============================================================================
# AI-ApiToken 反向代理配置（适配 kejilion 一键脚本的 docker 版 nginx）
# =============================================================================
# 使用方式：
#   1. 在 kejilion 脚本里选「反向代理」：域名 aiapitoken.qd.je，IP 127.0.0.1，端口 8089
#      （脚本会自动签发证书并生成 /home/web/conf.d/aiapitoken.qd.je.conf）
#   2. 用本文件覆盖它生成的反代配置：
#        cp nginx-kejilion-reverse-proxy.conf /home/web/conf.d/aiapitoken.qd.je.conf
#   3. 校验并热重载：
#        docker exec nginx nginx -t && docker exec nginx nginx -s reload
#
# 相对 kejilion 默认模板（reverse-proxy-backend.conf）的关键适配点：
#   - proxy_buffering off：关闭响应缓冲。AI API 的 SSE 流式输出（stream: true）
#     默认会被 nginx 缓冲成一大块，导致前端"卡住等全部生成完"才一次性返回。
#   - proxy_read_timeout 3600s：长文本/大模型推理生成可能超过默认的 360s。
#   - 真实客户端 IP：域名走 Cloudflare 时，用 CF-Connecting-IP 透传真实 IP；
#     直连（灰云）时回退到 $remote_addr。
# =============================================================================

# 真实客户端 IP：Cloudflare 代理时取 CF-Connecting-IP，否则用直连对端 IP。
map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

upstream backend_aiapitoken {
    hash $remote_addr consistent;
    server 127.0.0.1:8089;
    keepalive 64;
}

server {
    include /etc/nginx/conf.d/waf/server-default*.inc;
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    server_name aiapitoken.qd.je;

    add_header_inherit merge;

    ssl_certificate /etc/nginx/certs/aiapitoken.qd.je_cert.pem;
    ssl_certificate_key /etc/nginx/certs/aiapitoken.qd.je_key.pem;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://backend_aiapitoken;
        proxy_http_version 1.1;

        # 转发头（透传真实客户端 IP）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $client_real_ip;
        proxy_set_header True-Client-IP "";
        proxy_set_header Forwarded "";

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ===== SSE 流式响应：必须关闭缓冲 =====
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # 长连接 / 大模型长生成超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|bmp|swf|eot|svg|ttf|woff|woff2|webp)$ {
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_pass http://backend_aiapitoken;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_cache backend_aiapitoken;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        aio threads;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Alt-Svc 'h3=":443"; ma=86400';
        log_not_found off;
        access_log off;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    client_max_body_size 1000m;
}

proxy_cache_path /var/cache/nginx/proxy/backend_aiapitoken levels=1:2 keys_zone=backend_aiapitoken:20m max_size=1g inactive=7d use_temp_path=off ;
